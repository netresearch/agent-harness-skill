# .github/workflows/pr-quality.yml
# Solo-maintainer auto-approve: approves PRs from repo collaborators
# so that required_approving_review_count >= 1 is satisfied without
# manual review for trusted authors.
#
# SECURITY: This caller runs on `pull_request_target`, so the job receives
# base-branch permissions (including `pull-requests: write`). Do NOT add an
# `actions/checkout` of the PR head or otherwise execute PR-controlled code
# here -- that would escalate untrusted code to write scope. All logic lives
# in the reusable workflow; this file must stay a thin caller.
#
# Authorization is unchanged from the previous inline implementation: the
# reusable resolves the author's repository permission via
# `GET /repos/{repo}/collaborators/{author}/permission` and approves only for
# write-or-higher. It does not consult `author_association`.

name: PR Quality Gates

on:
    pull_request_target:
        types: [opened, synchronize, reopened]

permissions: {}

jobs:
    pr-quality:
        uses: netresearch/skill-repo-skill/.github/workflows/pr-quality.yml@main
        permissions:
            pull-requests: write
