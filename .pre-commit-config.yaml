# Pre-commit hooks — embodies the CI/Hook Parity Principle for this repo.
#
# Every hook below ALSO runs in CI; CI is the authoritative backstop. Local
# hooks are pinned by `rev:` and Renovate bumps them automatically. There is a
# small drift window between a Renovate bump in CI and the local config catching
# up; this is the standard pre-commit pattern.
#
# Local hooks:
#   - validate-skill            (via skill-repo-skill)
#   - check-version-parity      (via skill-repo-skill)
#   - markdownlint-cli2
#   - yamllint
#   - ruff check + format
#   - shellcheck
#   - pre-commit-hooks: trailing-whitespace, end-of-file-fixer,
#       check-merge-conflict, check-added-large-files, check-json, check-yaml
#
# CI-only (not mirrored here):
#   - checkpoint YAML schema validation (uses `uv run --with pyyaml` patterns
#     that are heavier than a pre-commit hook should be)
#
# See skills/agent-harness/references/enforcement-mechanisms.md for the
# CI/Hook Parity Principle in full.
#
# Install once after clone: `pre-commit install`.
# Bypass (use sparingly): `git commit --no-verify`. If you need this often,
# the hook is wrong — fix it; don't tolerate the bypass.

default_install_hook_types: [pre-commit]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-json
      - id: check-yaml
        args: [--allow-multiple-documents]

  - repo: https://github.com/netresearch/skill-repo-skill
    rev: v1.36.0
    hooks:
      - id: validate-skill
      - id: check-version-parity

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
        files: '\.md$'

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [-c, .yamllint.yml]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      - id: ruff
      - id: ruff-format

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
